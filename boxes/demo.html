<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>示範遊戲盒</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#101724;color:#eee;font:14px system-ui}#stage{height:calc(100% - 63px);display:grid;place-items:center;perspective:900px;touch-action:none;background:radial-gradient(circle,#2d4057,#101724 70%);cursor:grab}#cube{position:relative;width:200px;height:260px;transform-style:preserve-3d}#cube div{position:absolute;left:50%;top:50%;backface-visibility:hidden;border:1px solid #ffffff29;display:grid;place-items:center;text-align:center;font-weight:bold;letter-spacing:2px;font-size:20px;background:linear-gradient(140deg,#263e6d,#121a32);box-shadow:inset 0 0 25px #0004}#toolbar{height:63px;display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap;background:#18243a;padding:5px}button{background:#304663;border:1px solid #546a8c;border-radius:6px;color:white;padding:6px;cursor:pointer;font-size:12px}</style></head><body><div id="stage"><div id="cube"></div></div><div id="toolbar"><button data-v="front">正面</button><button data-v="back">背面</button><button data-v="left">左側</button><button data-v="right">右側</button><button data-v="top">頂面</button><button data-v="bottom">底面</button><button id="spin">自動旋轉</button><button id="reset">重置</button></div><script>(()=>{let cube=document.getElementById('cube'),stage=document.getElementById('stage'),N=['正面','背面','左側','右側','頂面','底面'],t=['translate(-50%,-50%) translateZ(35px)','translate(-50%,-50%) rotateY(180deg) translateZ(35px)','translate(-50%,-50%) rotateY(-90deg) translateZ(100px)','translate(-50%,-50%) rotateY(90deg) translateZ(100px)','translate(-50%,-50%) rotateX(90deg) translateZ(130px)','translate(-50%,-50%) rotateX(-90deg) translateZ(130px)'];N.forEach((n,i)=>{let d=document.createElement('div');d.style.width=(i===2||i===3?70:200)+'px';d.style.height=(i>=4?70:260)+'px';d.style.transform=t[i];d.textContent=i===0?'示範盒裝':n;cube.append(d)});let rx=-15,ry=-25,z=1,spin=false,drag=null;function draw(){cube.style.transform=`scale(${z}) rotateX(${rx}deg) rotateY(${ry}deg)`}const A={front:[0,0],back:[0,180],left:[0,90],right:[0,-90],top:[-90,0],bottom:[90,0]};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{[rx,ry]=A[b.dataset.v];spin=false;draw()});document.getElementById('reset').onclick=()=>{rx=-15;ry=-25;z=1;spin=false;draw()};document.getElementById('spin').onclick=()=>{spin=!spin;if(spin)requestAnimationFrame(loop)};function loop(){if(!spin)return;ry+=.35;draw();requestAnimationFrame(loop)}stage.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,rx,ry};stage.setPointerCapture(e.pointerId);spin=false};stage.onpointermove=e=>{if(!drag)return;ry=drag.ry+(e.clientX-drag.x)*.5;rx=drag.rx-(e.clientY-drag.y)*.5;draw()};stage.onpointerup=stage.onpointercancel=()=>drag=null;stage.onwheel=e=>{e.preventDefault();z=Math.max(.25,Math.min(3,z*(e.deltaY<0?1.1:.9)));draw()};stage.ondblclick=()=>document.getElementById('reset').click();draw()})();</script></body></html>
